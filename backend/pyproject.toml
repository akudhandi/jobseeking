[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobseeking"
version = "0.1.0"
description = "LinkedIn job-market scraper + analytics API for Jawa Timur"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "httpx>=0.27.2",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[project.scripts]
jobseeking-scrape = "jobseeking.pipeline:main"
jobseeking-api = "jobseeking.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jobseeking"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
