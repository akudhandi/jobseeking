# Alembic configuration for the jobseeking database.
#
# Deliberately no `sqlalchemy.url` here: migrations/env.py falls back to the
# application settings (DATABASE_URL), so no credentials live in a tracked file.
# Callers that need a different database (tests) set it at runtime with
# ``Config.set_main_option("sqlalchemy.url", ...)``.
#
# Run from backend/:  alembic current | alembic upgrade head | alembic revision --autogenerate

[alembic]
# %(here)s keeps the path anchored to this file, so `alembic` works from any cwd
# and inside the containers where the ini lives at /app/alembic.ini.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARNING keeps `alembic current`/`upgrade` output (printed directly) while
# keeping init_db()'s startup chatter out of the api and scraper logs.
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
